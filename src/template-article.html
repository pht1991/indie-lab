<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>{{TITLE}}</title>
  <meta name="description" content="{{DESCRIPTION}}" />
  <link rel="canonical" href="{{CANONICAL}}" />
  <meta property="og:type" content="article" />
  <meta property="og:title" content="{{OG_TITLE}}" />
  <meta property="og:description" content="{{OG_DESCRIPTION}}" />
  <meta property="og:url" content="{{CANONICAL}}" />
  <meta property="og:image" content="https://phtbyte.com/assets/og/{{OG_IMAGE}}" />
  <meta property="og:image:width" content="1200" />
  <meta property="og:image:height" content="630" />
  <meta property="og:image:alt" content="{{OG_IMAGE_ALT}}" />
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:image" content="https://phtbyte.com/assets/og/{{OG_IMAGE}}" />
  <link rel="stylesheet" href="/assets/style.css?v={{CSS_VERSION}}" />
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "Article",
    "headline": "{{LD_HEADLINE}}",
    "description": "{{LD_DESCRIPTION}}",
    "author": { "@type": "Person", "name": "{{AUTHOR_NAME}}", "jobTitle": "{{AUTHOR_TITLE}}" },
    "publisher": { "@type": "Organization", "name": "Indie Game Lab" },
    "datePublished": "{{DATE_PUBLISHED}}",
    "dateModified": "{{DATE_MODIFIED}}",
    "mainEntityOfPage": "{{CANONICAL}}"
  }
  </script>
{{EXTRA_LD}}
</head>
<body>
  <header class="site">
    <div class="wrap">
      <a class="brand" href="/">Indie Game Lab</a>
      <nav class="site">
        <a href="/">Home</a>
        <a href="/#articles">Articles</a>
        <a href="/#about">About</a>
      </nav>
    </div>
  </header>

  <main class="wrap">
{{ARTICLE_BODY}}
{{AMAZON_NATIVE}}
  </main>

  <footer class="site">
    <div class="wrap">
      <p>© <span id="year"></span> Indie Game Lab. Built for developers who'd rather read a post-mortem than a press release.</p>
    </div>
    <script>document.getElementById('year').textContent = new Date().getFullYear();</script>
  </footer>
</body>
</html>
